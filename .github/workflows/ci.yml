name: Research Repository Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret scan
        run: python scripts/check_secrets.py

      - name: No signer or mainnet-send check
        run: python scripts/check_no_signer.py

      - name: Validate dependency lock
        run: python scripts/check_dependency_lock.py

      - name: Install locked developer tools
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Lint
        run: ruff check src tests scripts

      - name: Formatting
        run: ruff format --check src tests scripts

      - name: Type check
        run: mypy src tests scripts

      - name: Python syntax validation
        run: python -m compileall -q src tests scripts

      - name: Unit tests
        run: python -m unittest discover -v

      - name: Dependency consistency
        run: python -m pip check

      - name: Dependency vulnerability audit
        run: pip-audit --requirement requirements-dev.lock --no-deps --disable-pip

      - name: Verify required project files
        run: |
          test -s AGENTS.md
          test -s .gitignore
          test -s .agents/rules/00-safety.md
          test -s .agents/rules/01-untrusted-content.md
          test -s .agents/rules/02-statistics.md
          test -s .agents/rules/03-repo-hygiene.md
          test -s .agents/workflows/preflight.md
          test -s .agents/workflows/phase-gate.md
          test -s .githooks/pre-commit
          test -s docs/dependencies.md
          test -s docs/protocol_facts.md
          test -s docs/security.md
          test -s requirements-dev.lock
          test -e research/injection_log.md
