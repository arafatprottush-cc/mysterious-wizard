[project]
name = "solana-sniper-research"
version = "0.1.0"
description = "Simulation-only research into Solana meme coin strategies"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
strict = true
files = ["src", "tests", "scripts"]
